<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathFinder 로그인</title>
<link rel="icon" href="robot-face.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16224A;--soft:#5E6782;--line:rgba(22,34,74,.1);--sky1:#F6F9FF;--sky2:#E6F0FF;--sky3:#CFE2FF;--blue:#2C64DB;--green:#12965A;--card:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);letter-spacing:-.3px;word-break:keep-all;
 background:linear-gradient(180deg,var(--sky1),var(--sky2) 60%,var(--sky3));display:grid;grid-template-columns:1fr 1fr}
a{color:inherit;text-decoration:none}
img{display:block}
.side{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:40px clamp(24px,5vw,72px);overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo img{width:38px;height:38px;object-fit:contain}
.side h1{font-size:clamp(30px,3.4vw,46px);line-height:1.25;margin:0 0 14px;font-weight:800;letter-spacing:-1.2px}
.side h1 span{color:var(--blue)}
.side p{margin:0;color:var(--soft);font-size:16px;line-height:1.7;max-width:380px}
.robot{width:min(300px,60%);margin:24px 0 0 auto}
.main{display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:40px 36px;box-shadow:0 20px 60px rgba(22,34,74,.08);border:1px solid var(--line)}
.card h2{margin:0 0 6px;font-size:26px;font-weight:800}
.card .sub{margin:0 0 28px;color:var(--soft);font-size:15px}
label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}
input[type=email],input[type=password]{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:inherit;font-size:15px;color:var(--ink);background:#FAFBFF;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(44,100,219,.12);background:#fff}
.field{margin-bottom:18px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);margin:-4px 0 24px}
.row label{display:flex;gap:8px;align-items:center;font-weight:500;margin:0}
.row a:hover{color:var(--blue)}
.btn{width:100%;height:52px;border:0;border-radius:999px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:var(--ink);color:#fff}
.primary:hover{background:#0F1836}
.or{display:flex;align-items:center;gap:12px;color:var(--soft);font-size:13px;margin:22px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:grid;gap:10px}
.kakao{background:#FEE500;color:#191919}
.naver{background:#03C75A;color:#fff}
.join{text-align:center;margin:26px 0 0;font-size:14px;color:var(--soft)}
.join a{color:var(--blue);font-weight:700}
.msg{display:none;margin:14px 0 0;font-size:14px;color:var(--green);text-align:center}
.msg.show{display:block}
@media(max-width:860px){body{grid-template-columns:1fr}.side{padding:24px 16px 0}.side .copy,.robot{display:none}.main{padding:24px 16px 48px}.card{padding:32px 22px}}
</style>
</head>
<body>
<aside class="side">
  <a class="logo" href="index.html"><img src="robot-face.png" alt="">PathFinder</a>
  <div class="copy">
    <h1>다시 오셨네요.<br><span>그려 둔 경로</span>가 기다려요.</h1>
    <p>로그인하면 저장해 둔 계획과, 그 사이 새로 열리거나 바뀐 지원을 이어서 볼 수 있어요.</p>
    <img class="robot" src="robot-flag.png" alt="깃발을 든 길잡이 로봇">
  </div>
  <span></span>
</aside>
<main class="main">
  <form class="card" id="f" novalidate>
    <h2>로그인</h2>
    <p class="sub">이메일로 이어서 시작하세요</p>
    <div class="field"><label for="em">이메일</label><input id="em" type="email" placeholder="name@example.com" autocomplete="off"></div>
    <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" placeholder="비밀번호 입력" autocomplete="off"></div>
    <div class="row"><label><input type="checkbox"> 로그인 유지</label><a href="#">비밀번호 찾기</a></div>
    <button class="btn primary" type="submit">로그인</button>
    <div class="or">또는</div>
    <div class="social">
      <button class="btn kakao" type="button">카카오로 시작하기</button>
      <button class="btn naver" type="button">네이버로 시작하기</button>
    </div>
    <p class="msg" id="msg">시연용 화면이에요. 입력한 내용은 어디로도 전송되지 않아요.</p>
    <p class="join">처음이신가요? <a href="app.html#signup">회원가입</a></p>
  </form>
</main>
<script>
// 시연용: 어떤 입력도 저장하거나 보내지 않는다
const msg=document.getElementById('msg');
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();location.href='app.html#building'});
document.querySelectorAll('.social .btn').forEach(b=>b.addEventListener('click',()=>msg.classList.add('show')));
</script>
</body>
</html>
